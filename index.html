<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>내 메모장</title>
<style>
  :root{
    --bg:#f5f5f4; --card:#ffffff; --text:#1c1917; --sub:#78716c;
    --line:#e7e5e4; --accent:#2563eb; --danger:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141414; --card:#1f1f1f; --text:#f5f5f4; --sub:#a8a29e; --line:#333; --accent:#60a5fa; --danger:#f87171; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  .user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
  .user img{width:28px;height:28px;border-radius:50%}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff}
  button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);padding:6px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  main{max-width:1000px;margin:0 auto;padding:16px}
  #login{text-align:center;padding:90px 16px}
  #login p{color:var(--sub);margin-bottom:24px}
  .composer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:20px}
  textarea{width:100%;min-height:90px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px}
  .preview{position:relative;margin:8px 0;display:none}
  .preview img{max-width:100%;max-height:260px;border-radius:10px;display:block}
  .preview button{position:absolute;top:6px;right:6px;padding:4px 9px;background:rgba(0,0,0,.6)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .filebtn{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--sub);cursor:pointer;font-size:14px}
  .filebtn input{display:none}
  .grid{columns:2 260px;column-gap:14px}
  .card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin:0 0 14px;overflow:hidden}
  .card img{width:100%;display:block;cursor:zoom-in}
  .card .body{padding:12px 14px}
  .card p{margin:0 0 8px;white-space:pre-wrap;word-break:break-word}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
  .meta button{background:transparent;color:var(--danger);padding:2px 6px;font-size:12px}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50}
  #lightbox img{max-width:96vw;max-height:92vh}
  #msg{color:var(--danger);font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📝 내 메모장</h1>
  <div class="user" id="userbox" hidden>
    <img id="avatar" alt="">
    <span id="uname"></span>
    <button class="ghost" id="logout">로그아웃</button>
  </div>
</header>

<main>
  <section id="login" hidden>
    <p>떠오르는 생각과 이미지를 언제 어디서나 기록하세요.</p>
    <button id="loginBtn">Google 계정으로 로그인</button>
    <div id="msg"></div>
  </section>

  <section id="app" hidden>
    <div class="composer">
      <textarea id="text" placeholder="지금 떠오른 생각을 적어보세요…"></textarea>
      <div class="preview" id="preview"><img id="pimg" alt=""><button id="clearImg">✕</button></div>
      <div class="bar">
        <label class="filebtn">📷 이미지 추가
          <input type="file" id="file" accept="image/*">
        </label>
        <button id="save">등록</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>아직 등록된 내용이 없습니다.</div>
  </section>
</main>

<div id="lightbox"><img id="lbimg" alt=""></div>

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
         onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy,
         onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let unsub = null;
let imageData = null;

/* ---------- 로그인 ---------- */
const provider = new GoogleAuthProvider();
$("loginBtn").onclick = async () => {
  $("msg").textContent = "";
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    // 모바일 브라우저에서 팝업이 막히면 리다이렉트 방식으로 전환
    if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)) {
      await signInWithRedirect(auth, provider);
    } else if (e.code !== "auth/popup-closed-by-user") {
      $("msg").textContent = "로그인 실패: " + e.code;
    }
  }
};
getRedirectResult(auth).catch(e => { $("msg").textContent = "로그인 실패: " + e.code; });
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    $("login").hidden = false; $("app").hidden = true; $("userbox").hidden = true;
    return;
  }
  $("login").hidden = true; $("app").hidden = false; $("userbox").hidden = false;
  $("uname").textContent = user.displayName || user.email;
  $("avatar").src = user.photoURL || "";
  const q = query(collection(db, "users", user.uid, "posts"), orderBy("createdAt", "desc"));
  unsub = onSnapshot(q, snap => render(snap.docs, user.uid));
});

/* ---------- 이미지 처리 (축소 + JPEG 압축) ---------- */
function resizeImage(file, maxSide = 1280, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    imageData = await resizeImage(f);
    $("pimg").src = imageData;
    $("preview").style.display = "block";
  } catch { alert("이미지를 불러올 수 없습니다."); }
  e.target.value = "";
};
$("clearImg").onclick = () => { imageData = null; $("preview").style.display = "none"; };

/* ---------- 등록 ---------- */
$("save").onclick = async () => {
  const user = auth.currentUser;
  const text = $("text").value.trim();
  if (!user || (!text && !imageData)) return;
  $("save").disabled = true;
  try {
    await addDoc(collection(db, "users", user.uid, "posts"), {
      text, image: imageData || null, createdAt: serverTimestamp()
    });
    $("text").value = ""; imageData = null; $("preview").style.display = "none";
  } catch (e) {
    alert("등록 실패: " + (e.code || e.message));
  }
  $("save").disabled = false;
};

/* ---------- 대시보드 ---------- */
function fmt(ts) {
  const d = ts ? ts.toDate() : new Date();   // 서버 시간 확정 전에는 현재 시각 표시
  return d.toLocaleString("ko-KR", { year:"numeric", month:"long", day:"numeric",
    weekday:"short", hour:"2-digit", minute:"2-digit", hour12:true });
}
function render(docs, uid) {
  const grid = $("grid");
  grid.innerHTML = "";
  $("empty").hidden = docs.length > 0;
  for (const d of docs) {
    const p = d.data();
    const card = document.createElement("article");
    card.className = "card";
    if (p.image) {
      const im = document.createElement("img");
      im.src = p.image; im.loading = "lazy"; im.alt = "";
      im.onclick = () => { $("lbimg").src = p.image; $("lightbox").style.display = "flex"; };
      card.appendChild(im);
    }
    const body = document.createElement("div");
    body.className = "body";
    if (p.text) { const t = document.createElement("p"); t.textContent = p.text; body.appendChild(t); }
    const meta = document.createElement("div");
    meta.className = "meta";
    const time = document.createElement("span"); time.textContent = fmt(p.createdAt);
    const del = document.createElement("button"); del.textContent = "삭제";
    del.onclick = async () => {
      if (confirm("이 항목을 삭제할까요?")) await deleteDoc(doc(db, "users", uid, "posts", d.id));
    };
    meta.append(time, del);
    body.appendChild(meta);
    card.appendChild(body);
    grid.appendChild(card);
  }
}
$("lightbox").onclick = () => { $("lightbox").style.display = "none"; };
</script>
</body>
</html>
